<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BorrowBox - Login</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg site-navbar sticky-top">
      <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="index.html">
          <span class="brand-mark">B</span>BorrowBox
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#menu"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
          <ul class="navbar-nav mx-auto">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="index.html#how">How It Works</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="index.html#items">Items</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="index.html#services">Services</a>
            </li>
          </ul>
          <div class="d-flex align-items-center gap-3">
            <a href="login.html" class="nav-login">Login</a>
            <a href="signup.html" class="btn btn-primary">Sign Up</a>
          </div>
        </div>
      </div>
    </nav>

    <!-- Login Form -->
    <div class="auth-wrap">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-md-6 col-lg-5">
            <div class="card">
              <div class="card-body p-4 p-md-5">
                <h3 class="text-center mb-1">Welcome back</h3>
                <p class="text-center text-muted mb-4">
                  Login to your BorrowBox account
                </p>

                <form id="loginForm" novalidate>
                  <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input
                      type="email"
                      class="form-control"
                      id="email"
                      placeholder="Enter your email"
                      required
                    />
                    <div class="invalid-feedback">
                      Please enter a valid email address.
                    </div>
                  </div>

                  <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input
                      type="password"
                      class="form-control"
                      id="password"
                      placeholder="Enter your password"
                      required
                    />
                    <div class="invalid-feedback">
                      Please enter your password.
                    </div>
                  </div>

                  <div class="mb-3 form-check">
                    <input
                      type="checkbox"
                      class="form-check-input"
                      id="remember"
                    />
                    <label class="form-check-label" for="remember"
                      >Remember me</label
                    >
                  </div>

                  <button type="submit" class="btn btn-primary w-100">
                    Login
                  </button>
                </form>

                <p class="text-center mt-4 mb-1">
                  Don't have an account? <a href="signup.html">Sign Up</a>
                </p>
                <p class="text-center mb-0">
                  <a href="admin-home.html" class="small"
                    >Login as Admin (demo)</a
                  >
                </p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <footer class="simple-footer text-center">
      <div class="container">
        &copy; 2026 BorrowBox | Muhammad Asad | BSEF24A034
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Simple form validation -->
    <script>
      var form = document.getElementById("loginForm");

      form.addEventListener("submit", function (event) {
        event.preventDefault(); // stop the normal submit
        form.classList.add("was-validated"); // show red/green messages

        if (form.checkValidity()) {
          window.location.href = "user-home.html"; // all fields are fine
        }
      });
    </script>
  </body>
</html>
